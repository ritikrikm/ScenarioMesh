name: external-target-smoke
on: [push, pull_request]

jobs:
  controlled-target:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and install ScenarioMesh
        run: mvn -B clean install

      - name: Clone independent Maven Cucumber target
        run: |
          git clone --depth 1 --branch test/controlled-contract \
            https://github.com/ritikrikm/scenariomesh-target-fixture.git \
            "$RUNNER_TEMP/scenariomesh-target-fixture"

      - name: Run exact seven-scenario external contract
        working-directory: ${{ runner.temp }}/scenariomesh-target-fixture
        run: |
          python3 scripts/generate_scenarios.py 7
          python3 scripts/set_workers.py 4
          rm -rf target/fixture-executions target/scenariomesh
          mkdir -p target
          set -o pipefail
          mvn -B test -Dfixture.browser.enabled=false | tee target/scenariomesh-maven.log
          python3 scripts/validate_execution.py 7
          test -f target/scenariomesh/report.html
          test -f target/scenariomesh/summary.json
          grep -Fq 'ScenarioMesh: takeover enabled' target/scenariomesh-maven.log
          grep -Fq 'adapter=junit-platform' target/scenariomesh-maven.log || \
            grep -Fq 'junit-platform' target/scenariomesh-maven.log
