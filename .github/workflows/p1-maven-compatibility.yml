name: p1-maven-compatibility
on: [push, pull_request]

jobs:
  reactor-and-jvm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and install ScenarioMesh
        run: mvn -B clean install -DskipTests
      - name: Target Jackson cannot break ScenarioMesh preflight
        working-directory: examples/junit5-conflicting-jackson-example
        run: |
          mvn -B clean test | tee hostile-jackson.log
          grep -Fq 'ScenarioMesh preflight: ownership proven' hostile-jackson.log
          test -f target/scenariomesh/summary.json
          grep -Fq '"total" : 1' target/scenariomesh/summary.json
          grep -Fq '"passed" : 1' target/scenariomesh/summary.json
          ! grep -Fq 'No serializer found for class io.scenariomesh.workerruntime.PreflightProbeMain' hostile-jackson.log
      - name: Explicit Surefire JVM selection is preserved
        working-directory: examples/junit5-explicit-jvm-example
        run: |
          mvn -B clean test -Dtest.jvm="$JAVA_HOME/bin/java" | tee target-run.log
          test -f target/scenariomesh/summary.json
          grep -Fq '"total" : 1' target/scenariomesh/summary.json
          grep -Fq '"passed" : 1' target/scenariomesh/summary.json
          grep -Fq "Test JVM                   : $JAVA_HOME/bin/java" target-run.log
      - name: Surefire jdkToolchain selection is preserved
        working-directory: examples/junit5-toolchain-example
        run: |
          mvn -B clean test -Dtoolchain.version=${{ matrix.java }} | tee toolchain-run.log
          test -f target/scenariomesh/summary.json
          grep -Fq '"total" : 1' target/scenariomesh/summary.json
          grep -Fq '"passed" : 1' target/scenariomesh/summary.json
          grep -Fq "Test JVM                   : $JAVA_HOME/bin/java" toolchain-run.log
      - name: JPMS module path safely remains native Maven
        working-directory: examples/junit5-jpms-example
        run: |
          mvn -B clean test -Dtest.module.path=true | tee jpms-native.log
          grep -Fq 'ScenarioMesh: pass-through for junit5-jpms-example' jpms-native.log
          grep -Fq '<useModulePath>' jpms-native.log
          test ! -f target/scenariomesh/summary.json
          test -f target/surefire-reports/TEST-example.ModularTest.xml
      - name: Modular project with useModulePath false can be accelerated
        working-directory: examples/junit5-jpms-example
        run: |
          mvn -B clean test -Dtest.module.path=false | tee jpms-classpath.log
          grep -Fq 'ScenarioMesh: takeover enabled after runtime ownership preflight' jpms-classpath.log
          test -f target/scenariomesh/summary.json
          grep -Fq '"total" : 1' target/scenariomesh/summary.json
          grep -Fq '"passed" : 1' target/scenariomesh/summary.json
      - name: Maven reactor order and module-local ownership
        working-directory: examples/multi-module-example
        run: |
          mvn -B clean test
          test -f module-a/target/scenariomesh/summary.json
          test -f module-b/target/scenariomesh/summary.json
          grep -Fq '"total" : 2' module-a/target/scenariomesh/summary.json
          grep -Fq '"passed" : 2' module-a/target/scenariomesh/summary.json
          grep -Fq '"total" : 2' module-b/target/scenariomesh/summary.json
          grep -Fq '"passed" : 2' module-b/target/scenariomesh/summary.json
      - name: Reactor project selection remains Maven-owned
        working-directory: examples/multi-module-example
        run: |
          mvn -B clean test -pl module-b -am
          test -f module-a/target/scenariomesh/summary.json
          test -f module-b/target/scenariomesh/summary.json
      - name: dependenciesToScan matches native Surefire dependency-test discovery
        working-directory: examples/dependencies-to-scan-example
        run: |
          mv .mvn/extensions.xml .mvn/extensions.xml.disabled
          mvn -B clean test -pl consumer -am
          test -f consumer/target/surefire-reports/TEST-example.dependency.ScannedDependencyTest.xml
          mv .mvn/extensions.xml.disabled .mvn/extensions.xml
          mvn -B clean test -pl consumer -am
          test -f consumer/target/scenariomesh/summary.json
          grep -Fq '"total" : 1' consumer/target/scenariomesh/summary.json
          grep -Fq '"passed" : 1' consumer/target/scenariomesh/summary.json
          grep -Fq 'runsFromDependencyJar()' consumer/target/scenariomesh/summary.json
      - name: JUnit Platform tag selection matches native Surefire
        working-directory: examples/junit5-tag-selection-example
        run: |
          mv .mvn/extensions.xml .mvn/extensions.xml.disabled
          mvn -B clean test
          grep -Fq 'Tests run: 2, Failures: 0, Errors: 0, Skipped: 0' target/surefire-reports/example.TaggedTest.txt
          mv .mvn/extensions.xml.disabled .mvn/extensions.xml
          mvn -B clean test
          test -f target/scenariomesh/summary.json
          grep -Fq '"total" : 2' target/scenariomesh/summary.json
          grep -Fq 'smokeRuns()' target/scenariomesh/summary.json
          grep -Fq 'apiRuns()' target/scenariomesh/summary.json
          ! grep -Fq 'excludedTagWins()' target/scenariomesh/summary.json
          ! grep -Fq 'unmatchedTagDoesNotRun()' target/scenariomesh/summary.json
      - name: JUnit 4 Vintage selection matches native Surefire
        working-directory: examples/junit4-vintage-example
        run: |
          mv .mvn/extensions.xml .mvn/extensions.xml.disabled
          mvn -B clean test
          test -f target/surefire-reports/TEST-example.LegacyJUnit4VintageTest.xml
          mv .mvn/extensions.xml.disabled .mvn/extensions.xml
          mvn -B clean test
          test -f target/scenariomesh/summary.json
          grep -Fq '"total" : 1' target/scenariomesh/summary.json
          grep -Fq 'runsThroughTargetVintageEngine' target/scenariomesh/summary.json
