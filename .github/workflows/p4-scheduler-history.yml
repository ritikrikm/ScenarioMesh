name: p4-scheduler-history
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  scheduler-history:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Configurable scheduling, LPT ordering, FIFO fallback, lifecycle affinity, versioned history and 5000-task scale
        run: >-
          mvn -B -pl scenariomesh-config,scenariomesh-coordinator,scenariomesh-scheduler -am test
          -Dtest='*SchedulingConfigTest,*SchedulingModeTest,*FifoSchedulingStrategyTest,*HistoryAwareFifoTest,*ExecutionHistoryStoreTest,*ExecutionHistoryHardeningTest,*SchedulerScaleTest'
          -Dsurefire.failIfNoSpecifiedTests=false
