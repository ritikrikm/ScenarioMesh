name: release-runtime-matrix
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  current-lts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Java 25 LTS repository contract
        run: mvn -B clean install
      - name: Java 25 target smoke
        working-directory: examples/junit5-example
        run: |
          mvn -B clean test
          test -f target/scenariomesh-yaml/summary.json
          grep -Fq '"passed" : 6' target/scenariomesh-yaml/summary.json
          grep -Fq '"skipped" : 2' target/scenariomesh-yaml/summary.json

  maven-3-ga:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install Apache Maven 3.9.16 GA
        run: |
          curl -fsSLo "$RUNNER_TEMP/maven.tgz" \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          tar -xzf "$RUNNER_TEMP/maven.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Verify exact Maven line
        run: mvn -version | grep -Fq 'Apache Maven 3.9.16'
      - name: Build ScenarioMesh on GA Maven
        run: ./mvnw -B clean install
      - name: Native-vs-ScenarioMesh target smoke
        working-directory: examples/junit5-example
        run: |
          mvn -B clean test
          test -f target/scenariomesh-yaml/summary.json
          grep -Fq '"passed" : 6' target/scenariomesh-yaml/summary.json
          grep -Fq '"skipped" : 2' target/scenariomesh-yaml/summary.json

  maven-4-preview:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install Apache Maven 4.0.0-rc-6 preview
        run: |
          curl -fsSLo "$RUNNER_TEMP/maven4.tgz" \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/4.0.0-rc-6/apache-maven-4.0.0-rc-6-bin.tar.gz
          tar -xzf "$RUNNER_TEMP/maven4.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-4.0.0-rc-6/bin" >> "$GITHUB_PATH"
      - name: Verify preview version
        run: mvn -version | grep -Fq 'Apache Maven 4.0.0-rc-6'
      - name: Build ScenarioMesh on Maven 4 preview
        run: mvn -B clean install
      - name: Maven 4 JUnit takeover and hostile-classpath contract
        run: |
          (
            cd examples/junit5-example
            mvn -B clean test
            grep -Fq '"passed" : 6' target/scenariomesh-yaml/summary.json
            grep -Fq '"skipped" : 2' target/scenariomesh-yaml/summary.json
          )
          (
            cd examples/junit5-conflicting-jackson-example
            mvn -B clean test
            grep -Fq '"passed" : 1' target/scenariomesh/summary.json
          )
      - name: Maven 4 framework and lifecycle compatibility laboratory
        if: matrix.java == '21'
        run: |
          for fixture in cucumber-junit-platform-example cucumber-junit4-example testng-example; do
            (
              cd "examples/$fixture"
              mvn -B clean test
              test -f target/scenariomesh/summary.json
              grep -Fq '"failed" : 0' target/scenariomesh/summary.json
            )
          done
          (
            cd examples/failsafe-junit5-example
            mvn -B clean verify
            grep -Fq '"passed" : 3' target/scenariomesh/summary.json
            test -f target/scenariomesh/deferred-verification.properties
          )
          (
            cd examples/unsupported-junit4-example
            mvn -B clean test
            test -f target/scenariomesh/summary.json
            grep -Fq '"total" : 1' target/scenariomesh/summary.json
            grep -Fq '"passed" : 1' target/scenariomesh/summary.json
            grep -Fq '"junit-platform"' target/scenariomesh/summary.json
            test ! -e target/surefire-reports/TEST-example.LegacyJUnit4Test.xml
          )

  maven-3-next-preview:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install Apache Maven 3.10.0-rc-1 preview
        run: |
          curl -fsSLo "$RUNNER_TEMP/maven3-next.tgz" \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0-rc-1/apache-maven-3.10.0-rc-1-bin.tar.gz
          tar -xzf "$RUNNER_TEMP/maven3-next.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.10.0-rc-1/bin" >> "$GITHUB_PATH"
      - name: Verify preview version
        run: mvn -version | grep -Fq 'Apache Maven 3.10.0-rc-1'
      - name: Build ScenarioMesh on Maven 3 next preview
        run: mvn -B clean install
      - name: Prove current JUnit target takeover
        run: |
          bash scripts/compat/maven-equivalence.sh examples/maven-equivalence-example \
            -Dsurefire.version=3.6.0-M1 -Djunit.version=6.1.3 \
            '-Dtest=AlphaContractTest#alphaOne+alphaTwo' -Dcontract.value=maven-3-next
