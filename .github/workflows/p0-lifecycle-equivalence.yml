name: p0-lifecycle-equivalence
on: [push, pull_request]

jobs:
  lifecycle-equivalence:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and install ScenarioMesh
        run: mvn -B clean install -DskipTests
      - name: JUnit class lifecycle is executed once
        working-directory: examples/junit5-example
        run: |
          rm -f target/junit-lifecycle.log
          mvn -B clean test
          test -f target/junit-lifecycle.log
          test "$(grep -Fc 'BEFORE_ALL' target/junit-lifecycle.log)" -eq 1
          test "$(grep -Fc 'AFTER_ALL' target/junit-lifecycle.log)" -eq 1
          test -f target/scenariomesh-yaml/summary.json
          grep -Fq '"passed" : 6' target/scenariomesh-yaml/summary.json
          grep -Fq '"skipped" : 2' target/scenariomesh-yaml/summary.json
      - name: JUnit PER_CLASS state and parameterized invocations are exact
        working-directory: examples/junit5-per-class-example
        run: |
          rm -f target/per-class-lifecycle.log
          mvn -B clean test
          test -f target/per-class-lifecycle.log
          test "$(grep -Fc 'BEFORE_ALL' target/per-class-lifecycle.log)" -eq 1
          test -f target/scenariomesh/summary.json
          jq -e '.total == 5 and .passed == 5' target/scenariomesh/summary.json >/dev/null
          jq -e '[.results[].displayName] | index("[1] 1") != null and index("[2] 2") != null and index("[3] 3") != null' target/scenariomesh/summary.json >/dev/null
      - name: Cucumber global lifecycle is executed once
        working-directory: examples/cucumber-junit-platform-example
        run: |
          rm -f target/cucumber-lifecycle.log
          mvn -B clean test
          test -f target/cucumber-lifecycle.log
          test "$(grep -Fc 'BEFORE_ALL' target/cucumber-lifecycle.log)" -eq 1
          test "$(grep -Fc 'AFTER_ALL' target/cucumber-lifecycle.log)" -eq 1
          test -f target/scenariomesh/summary.json
      - name: Native and ScenarioMesh class selector contract is identical
        run: |
          bash scripts/compat/maven-equivalence.sh examples/maven-equivalence-example \
            -Dtest=AlphaContractTest,BetaContractTest -Dcontract.value=cli
      - name: Native and ScenarioMesh wildcard selector contract is identical
        run: |
          bash scripts/compat/maven-equivalence.sh examples/maven-equivalence-example \
            -Dtest=Alpha* -Dcontract.value=cli
      - name: Native and ScenarioMesh advanced selector grammar is identical
        run: |
          bash scripts/compat/maven-equivalence.sh examples/maven-equivalence-example \
            '-Dtest=AlphaContractTest#alphaOne+alphaTwo' -Dcontract.value=cli
          bash scripts/compat/maven-equivalence.sh examples/maven-equivalence-example \
            '-Dtest=#alpha*' -Dcontract.value=cli
          bash scripts/compat/maven-equivalence.sh examples/maven-equivalence-example \
            '-Dtest=*ContractTest,!BetaContractTest,!GammaContractTest' -Dcontract.value=cli
          bash scripts/compat/maven-equivalence.sh examples/maven-equivalence-example \
            '-Dtest=%regex[.*.AlphaContractTest.class#alpha.*]' -Dcontract.value=cli
      - name: Native and ScenarioMesh collection selector contract is identical
        run: |
          bash scripts/compat/maven-equivalence.sh examples/maven-equivalence-example \
            '-Dsurefire.includes=**/AlphaContractTest.java,**/BetaContractTest.java' \
            '-Dsurefire.excludes=**/BetaContractTest.java' -Dcontract.value=cli
      - name: Native and ScenarioMesh selector-file contract is identical
        run: |
          bash scripts/compat/maven-equivalence.sh examples/maven-equivalence-example \
            -Pselection-files -Dcontract.value=cli
      - name: Command selector overrides configured and file selectors identically
        run: |
          bash scripts/compat/maven-equivalence.sh examples/maven-equivalence-example \
            -Pselection-files '-Dtest=AlphaContractTest#alphaOne' -Dcontract.value=cli
      - name: Native and ScenarioMesh Failsafe selector contract is identical
        env:
          MAVEN_EQUIVALENCE_GOAL: verify
        run: |
          bash scripts/compat/maven-equivalence.sh examples/failsafe-junit5-example \
            '-Dit.test=CheckoutIT#cardPayment+bankTransfer'
          bash scripts/compat/maven-equivalence.sh examples/failsafe-junit5-example \
            '-Dit.test=*IT,!LoginIT'
          bash scripts/compat/maven-equivalence.sh examples/failsafe-junit5-example \
            '-Dit.test=%regex[.*.CheckoutIT.class#card.*]'
          bash scripts/compat/maven-equivalence.sh examples/failsafe-junit5-example \
            '-Dfailsafe.includes=**/CheckoutIT.java,**/LoginIT.java' \
            '-Dfailsafe.excludes=**/LoginIT.java'
      - name: Native and ScenarioMesh TestNG suite XML group precedence is identical
        run: |
          bash scripts/compat/maven-equivalence.sh examples/testng-suite-xml-example
      - name: Native and ScenarioMesh fork process context is identical
        run: |
          bash scripts/compat/maven-equivalence.sh examples/maven-equivalence-example \
            -Pfork-context -Dtest=AlphaContractTest -Dcontract.value=cli -Dcontract.precedence=cli
          grep -Fq 'precedence=cli' examples/maven-equivalence-example/target/maven-equivalence-events.log
          grep -Fq 'configured=configured-value' examples/maven-equivalence-example/target/maven-equivalence-events.log
          grep -Fq 'excluded=null' examples/maven-equivalence-example/target/maven-equivalence-events.log
          grep -Fq 'overlay=configured-overlay' examples/maven-equivalence-example/target/maven-equivalence-events.log
          grep -Fq 'empty=' examples/maven-equivalence-example/target/maven-equivalence-events.log
          grep -Fq 'assertions=false' examples/maven-equivalence-example/target/maven-equivalence-events.log
          grep -Fq 'cwd='"$(cd examples/maven-equivalence-example/target && pwd)" examples/maven-equivalence-example/target/maven-equivalence-events.log
