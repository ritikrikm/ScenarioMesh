name: p5-observability
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  observability:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Structured correlated redacted event contract
        run: >-
          mvn -B -pl scenariomesh-coordinator -am test
          -Dtest='*RunLoggerTest'
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: End-to-end run produces machine-readable events
        run: mvn -B clean install -DskipTests
      - name: Execute target and validate event stream
        working-directory: examples/junit5-example
        run: |
          rm -rf target/scenariomesh-yaml
          mvn -B test
          run_dir="$(find target/scenariomesh-yaml/runs -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$run_dir"
          test -s "$run_dir/events.jsonl"
          grep -Fq '"type":"TASK_COMPLETED"' "$run_dir/events.jsonl"
          grep -Fq '"workerId":"worker-' "$run_dir/events.jsonl"
          grep -Fq '"taskId":' "$run_dir/events.jsonl"
          grep -Fq '"durationMillis":' "$run_dir/events.jsonl"
          grep -Fq '"queueDepth":' "$run_dir/events.jsonl"
