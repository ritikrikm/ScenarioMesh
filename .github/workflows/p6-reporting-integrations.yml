name: p6-reporting-integrations
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  reporting-integrations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Built-in reports and external exporter SPI
        run: >-
          mvn -B -pl scenariomesh-reporting -am test
          -Dtest='*LatestReportCleanerTest,*ReportExportersTest'
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Full report compatibility
        run: mvn -B clean install -DskipTests
      - name: Verify deterministic standard JSON, JUnit XML and HTML output
        working-directory: examples/junit5-example
        run: |
          rm -rf target/scenariomesh-yaml
          mvn -B test
          test -f target/scenariomesh-yaml/summary.json
          test -f target/scenariomesh-yaml/junit.xml
          test -f target/scenariomesh-yaml/report.html
          grep -Fq '<testsuite name="ScenarioMesh"' target/scenariomesh-yaml/junit.xml
          grep -Fq ' tests="8"' target/scenariomesh-yaml/junit.xml
          grep -Fq ' skipped="2"' target/scenariomesh-yaml/junit.xml
          grep -Fq '"passed" : 6' target/scenariomesh-yaml/summary.json
          grep -Fq '"skipped" : 2' target/scenariomesh-yaml/summary.json
          test "$(grep -c '<testcase ' target/scenariomesh-yaml/junit.xml)" -eq 8
          test "$(grep -o '"scenarioId"' target/scenariomesh-yaml/summary.json | wc -l)" -eq 8
          cp target/scenariomesh-yaml/junit.xml "$RUNNER_TEMP/junit-first.xml"
          cp target/scenariomesh-yaml/summary.json "$RUNNER_TEMP/summary-first.json"
          mvn -B test
          # Compare semantic identities/counts; timestamps and measured durations are intentionally not byte-for-byte contracts.
          test "$(grep -c '<testcase ' target/scenariomesh-yaml/junit.xml)" -eq 8
          test "$(grep -o '"scenarioId"' target/scenariomesh-yaml/summary.json | wc -l)" -eq 8
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          old = json.loads(Path(os.environ['RUNNER_TEMP'], 'summary-first.json').read_text())
          new = json.loads(Path('target/scenariomesh-yaml/summary.json').read_text())

          def stable_id(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'))

          def identities(doc):
              rows = doc.get('results', [])
              return sorted((stable_id(r.get('scenarioId')), r.get('status')) for r in rows)

          old_identities = identities(old)
          new_identities = identities(new)
          assert old_identities == new_identities
          assert len(new_identities) == len({scenario_id for scenario_id, _ in new_identities})
          PY
