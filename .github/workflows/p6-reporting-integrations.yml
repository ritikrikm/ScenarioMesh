name: p6-reporting-integrations
on: [push, pull_request]

jobs:
  reporting-integrations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Built-in reports and external exporter SPI
        run: >-
          mvn -B -pl scenariomesh-reporting -am test
          -Dtest='*LatestReportCleanerTest,*ReportExportersTest'
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Full report compatibility
        run: mvn -B clean install -DskipTests
      - name: Verify standard JSON, JUnit XML and HTML output
        working-directory: examples/junit5-example
        run: |
          mvn -B test
          test -f target/scenariomesh-yaml/summary.json
          test -f target/scenariomesh-yaml/junit.xml
          test -f target/scenariomesh-yaml/report.html
          grep -Fq '<testsuite name="ScenarioMesh"' target/scenariomesh-yaml/junit.xml
          grep -Fq '"passed" : 6' target/scenariomesh-yaml/summary.json
