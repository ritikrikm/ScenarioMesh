name: Maven rerun semantics

on:
  push:
  pull_request:

jobs:
  junit5-rerun:
    strategy:
      matrix:
        java: [17, 21]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and install ScenarioMesh
        run: mvn -B -ntp clean install
      - name: Run deterministic fail-once Maven fixture
        working-directory: examples/rerun-junit5-example
        run: mvn -B -ntp test | tee target-rerun-console.log
      - name: Verify logical retry semantics
        working-directory: examples/rerun-junit5-example
        shell: bash
        run: |
          set -euo pipefail
          REPORT=target/scenariomesh/junit.xml
          SUMMARY=target/scenariomesh/maven-retry-summary.json
          EVENTS=$(find target/scenariomesh/runs -name events.jsonl -print -quit)
          test -f "$REPORT"
          test -f "$SUMMARY"
          test -n "$EVENTS"
          grep -q 'tests="1"' "$REPORT"
          grep -q 'failures="0"' "$REPORT"
          grep -q '<flakyFailure' "$REPORT"
          grep -q '"flaky" : 1' "$SUMMARY"
          grep -q '"FLAKY"' "$SUMMARY"
          grep -q 'MAVEN_RERUN_ROUND' "$EVENTS"
          grep -q 'ScenarioMesh preflight: ownership proven' target-rerun-console.log
