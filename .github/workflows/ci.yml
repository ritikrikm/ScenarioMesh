name: ci
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and install ScenarioMesh
        run: mvn -B clean install
      - name: ScenarioMesh init packaged CLI is safe and idempotent
        run: |
          cli="scenariomesh-cli/target/scenariomesh-cli-0.1.0-SNAPSHOT.jar"
          test -f "$cli"
          java -jar "$cli" version | grep -Fxq '0.1.0-SNAPSHOT'
          project="$RUNNER_TEMP/scenariomesh init fixture"
          mkdir -p "$project"
          printf '%s\n' '<project><modelVersion>4.0.0</modelVersion><groupId>example</groupId><artifactId>fixture</artifactId><version>1</version></project>' > "$project/pom.xml"
          java -jar "$cli" init --project "$project"
          test -f "$project/.mvn/extensions.xml"
          test -f "$project/scenariomesh.yml"
          grep -Fq '<artifactId>scenariomesh-maven-extension</artifactId>' "$project/.mvn/extensions.xml"
          grep -Fq '<version>0.1.0-SNAPSHOT</version>' "$project/.mvn/extensions.xml"
          grep -Fq 'configVersion: 1' "$project/scenariomesh.yml"
          before_extensions="$(sha256sum "$project/.mvn/extensions.xml")"
          before_config="$(sha256sum "$project/scenariomesh.yml")"
          java -jar "$cli" init --project "$project" | grep -Fq 'already initialized; no changes required'
          test "$before_extensions" = "$(sha256sum "$project/.mvn/extensions.xml")"
          test "$before_config" = "$(sha256sum "$project/scenariomesh.yml")"
          dry="$RUNNER_TEMP/scenariomesh dry run fixture"
          mkdir -p "$dry"
          cp "$project/pom.xml" "$dry/pom.xml"
          java -jar "$cli" init --dry-run --project "$dry" | grep -Fq 'CREATE .mvn/extensions.xml'
          test ! -e "$dry/.mvn/extensions.xml"
          test ! -e "$dry/scenariomesh.yml"
      - name: JUnit 5 normal Maven command with YAML config
        working-directory: examples/junit5-example
        run: mvn -B test
      - name: Verify JUnit skipped and aborted outcomes are never false passes
        run: |
          test -f examples/junit5-example/target/scenariomesh-yaml/summary.json
          test -f examples/junit5-example/target/scenariomesh-yaml/junit.xml
          grep -Fq '"skipped" : 2' examples/junit5-example/target/scenariomesh-yaml/summary.json
          test "$(grep -Fc '"status" : "SKIPPED"' examples/junit5-example/target/scenariomesh-yaml/summary.json)" -eq 2
          grep -Fq 'skipped="2"' examples/junit5-example/target/scenariomesh-yaml/junit.xml
          grep -Fq '<skipped ' examples/junit5-example/target/scenariomesh-yaml/junit.xml
      - name: Cucumber JUnit Platform normal Maven command
        working-directory: examples/cucumber-junit-platform-example
        run: mvn -B test
      - name: Cucumber JUnit 4 normal Maven command
        working-directory: examples/cucumber-junit4-example
        run: mvn -B test
      - name: TestNG normal Maven command
        working-directory: examples/testng-example
        run: mvn -B test
      - name: Verify TestNG skipped and disabled outcomes are never false passes
        run: |
          test -f examples/testng-example/target/scenariomesh/summary.json
          test -f examples/testng-example/target/scenariomesh/junit.xml
          grep -Fq '"skipped" : 2' examples/testng-example/target/scenariomesh/summary.json
          test "$(grep -Fc '"status" : "SKIPPED"' examples/testng-example/target/scenariomesh/summary.json)" -eq 2
          grep -Fq 'skipped="2"' examples/testng-example/target/scenariomesh/junit.xml
      - name: Failsafe verify lifecycle takeover
        working-directory: examples/failsafe-junit5-example
        run: mvn -B clean compile verify
      - name: Worker crash fails only its uncertain scope and replacement continues independent scope
        working-directory: examples/worker-crash-recovery-example
        run: |
          set +e
          mvn -B clean test > crash-recovery.log 2>&1
          exit_code=$?
          set -e
          cat crash-recovery.log
          test "$exit_code" -ne 0
          test -f target/scenariomesh/report.html
          test -f target/scenariomesh/summary.json
          grep -Fq 'worker-2 REPLACED worker-1' crash-recovery.log
          grep -Fq 'worker-2 PASSED b_runsAfterReplacement()' crash-recovery.log
          grep -Fq 'worker-2 PASSED c_alsoRunsAfterReplacement()' crash-recovery.log
          test "$(grep -Fc 'WORKER_FAILURE' target/scenariomesh/summary.json)" -eq 1
          grep -Fq 'worker-2' target/scenariomesh/summary.json
      - name: Scoped infrastructure failure is not silently retried
        working-directory: examples/worker-crash-recovery-example
        run: |
          set +e
          mvn -B clean test -Dscenariomesh.execution.infrastructureRetries=1 > crash-retry.log 2>&1
          exit_code=$?
          set -e
          cat crash-retry.log
          test "$exit_code" -ne 0
          test -f target/scenariomesh/summary.json
          grep -Fq 'WORKER_FAILURE' target/scenariomesh/summary.json
          grep -Fq 'worker-2 REPLACED worker-1' crash-retry.log
          grep -Fq 'worker-2 PASSED b_runsAfterReplacement()' crash-retry.log
          grep -Fq 'worker-2 PASSED c_alsoRunsAfterReplacement()' crash-retry.log
          if grep -Fq 'RETRY a_crashWorker()' crash-retry.log; then
            echo 'Lifecycle-scoped crash was retried even though retry safety is unproven'
            exit 1
          fi
          if grep -Fq 'RUN junit5 scope 1 leaf/leaves attempt=2' crash-retry.log; then
            echo 'Uncertain lifecycle scope executed a second time'
            exit 1
          fi
      - name: Normal test failure keeps worker alive
        working-directory: examples/test-failure-continuation-example
        run: |
          set +e
          mvn -B clean test > test-failure-continuation.log 2>&1
          exit_code=$?
          set -e
          cat test-failure-continuation.log
          test "$exit_code" -ne 0
          test -f target/scenariomesh/summary.json
          grep -Fq 'TEST_FAILURE' target/scenariomesh/summary.json
          grep -Fq 'worker-1 PASSED b_sameWorkerContinues()' test-failure-continuation.log
          grep -Fq 'worker-1 PASSED c_sameWorkerStillContinues()' test-failure-continuation.log
          if grep -Fq ' REPLACED ' test-failure-continuation.log; then
            echo 'Normal test failure incorrectly replaced the worker'
            exit 1
          fi
      - name: Task-count recycling replaces healthy workers between independent scopes
        working-directory: examples/worker-recycling-scopes-example
        run: |
          mvn -B clean test -Dscenariomesh.workers.maxTasksPerWorker=1 > task-recycling.log 2>&1
          cat task-recycling.log
          test "$(grep -Fc 'PASSED firstScope()' task-recycling.log)" -eq 1
          test "$(grep -Fc 'PASSED secondScope()' task-recycling.log)" -eq 1
          test "$(grep -Fc 'PASSED thirdScope()' task-recycling.log)" -eq 1
          test "$(grep -Fc 'REPLACED worker-1 after task-count recycling after 1 task(s)' task-recycling.log)" -eq 1
          test "$(grep -Fc 'REPLACED worker-2 after task-count recycling after 1 task(s)' task-recycling.log)" -eq 1
      - name: Heap threshold recycles healthy workers between independent scopes
        working-directory: examples/worker-recycling-scopes-example
        run: |
          mvn -B clean test -Dscenariomesh.workers.maxHeapUsagePercent=1 -Dscenariomesh.workers.jvmArgs=-Xmx64m > heap-recycling.log 2>&1
          cat heap-recycling.log
          grep -Fq 'after heap recycling at ' heap-recycling.log
          grep -Fq ' PASSED secondScope()' heap-recycling.log
          grep -Fq ' PASSED thirdScope()' heap-recycling.log
      - name: Per-task cleanup hook executes after every task
        working-directory: examples/cleanup-hook-example
        run: |
          mvn -B clean test
          test -f target/cleanup-hook.log
          test "$(wc -l < target/cleanup-hook.log)" -eq 2
          grep -Fq 'firstTask()|worker-1|attempt=1' target/cleanup-hook.log
          grep -Fq 'secondTask()|worker-1|attempt=1' target/cleanup-hook.log
      - name: Retiring worker kills descendant process tree
        working-directory: examples/process-tree-cleanup-example
        run: |
          mvn -B clean test > process-tree-cleanup.log 2>&1
          cat process-tree-cleanup.log
          grep -Fq 'worker-2 REPLACED worker-1 after task-count recycling after 1 task(s)' process-tree-cleanup.log
          test "$(grep -Fc 'PASSED independentScopeOne()' process-tree-cleanup.log)" -eq 1
          test "$(grep -Fc 'PASSED independentScopeTwo()' process-tree-cleanup.log)" -eq 1
      - name: Surefire includes selection is reproduced by ScenarioMesh
        working-directory: examples/junit5-surefire-pass-through-example
        run: mvn -B test
      - name: Unsupported generic JUnit 4 uses normal Maven execution
        working-directory: examples/unsupported-junit4-example
        run: mvn -B test
      - name: Mixed JUnit 4 and JUnit 5 is owned once through JUnit Platform
        working-directory: examples/mixed-junit4-junit5-pass-through-example
        run: mvn -B clean test
      - name: TestNG group filtering is reproduced by ScenarioMesh
        working-directory: examples/testng-group-pass-through-example
        run: mvn -B clean test -Dgroups=smoke
      - name: Verify reports were generated
        run: |
          test -f examples/junit5-example/target/scenariomesh-yaml/report.html
          test ! -e examples/junit5-example/target/scenariomesh/report.html
          test -f examples/cucumber-junit-platform-example/target/scenariomesh/report.html
          test -f examples/cucumber-junit4-example/target/scenariomesh/report.html
          test -f examples/testng-example/target/scenariomesh/report.html
          test -f examples/failsafe-junit5-example/target/scenariomesh/report.html
          test -f examples/failsafe-junit5-example/target/scenariomesh/deferred-verification.properties
          test -f examples/cleanup-hook-example/target/scenariomesh/report.html
          test -f examples/process-tree-cleanup-example/target/scenariomesh/report.html
          test -f examples/worker-recycling-scopes-example/target/scenariomesh/report.html
          test -f examples/junit5-surefire-pass-through-example/target/scenariomesh/report.html
          test -f examples/testng-group-pass-through-example/target/scenariomesh/report.html
      - name: Verify modern report content and machine-readable timing
        run: |
          grep -q 'data-filter="passed"' examples/cucumber-junit4-example/target/scenariomesh/report.html
          grep -q 'data-filter="skipped"' examples/cucumber-junit4-example/target/scenariomesh/report.html
          grep -q 'data-filter="failed"' examples/cucumber-junit4-example/target/scenariomesh/report.html
          grep -q 'Worker execution time' examples/cucumber-junit4-example/target/scenariomesh/report.html
          grep -q 'Estimated serial execution time' examples/cucumber-junit4-example/target/scenariomesh/report.html
          grep -q '"sequentialEquivalentMillis"' examples/cucumber-junit4-example/target/scenariomesh/summary.json
          grep -q '"estimatedTimeSavedMillis"' examples/cucumber-junit4-example/target/scenariomesh/summary.json
          grep -q '"workers"' examples/cucumber-junit4-example/target/scenariomesh/summary.json
      - name: Verify Surefire includes exact selection under ScenarioMesh ownership
        run: |
          summary=examples/junit5-surefire-pass-through-example/target/scenariomesh/summary.json
          test -f "$summary"
          grep -Fq '"total" : 1' "$summary"
          grep -Fq 'selectedBySurefireConfiguration()' "$summary"
          if grep -Fq 'mustNotRunWhenSurefireIncludesArePreserved()' "$summary"; then
            echo 'Surefire include parity selected a class native Surefire would exclude'
            exit 1
          fi
      - name: Verify unsupported project was not taken over
        run: |
          test -f examples/unsupported-junit4-example/target/surefire-reports/TEST-example.LegacyJUnit4Test.xml
          test ! -e examples/unsupported-junit4-example/target/scenariomesh/report.html
      - name: Verify mixed JUnit project has one ScenarioMesh owner for both engines
        run: |
          summary=examples/mixed-junit4-junit5-pass-through-example/target/scenariomesh/summary.json
          test -f "$summary"
          grep -Fq '"total" : 2' "$summary"
          grep -Fq 'jupiterRunsThroughScenarioMesh()' "$summary"
          grep -Fq 'vintageRunsThroughScenarioMesh' "$summary"
          test ! -d examples/mixed-junit4-junit5-pass-through-example/target/surefire-reports
      - name: Verify TestNG group-filtered project is owned exactly once
        run: |
          summary=examples/testng-group-pass-through-example/target/scenariomesh/summary.json
          test -f "$summary"
          grep -Fq '"total" : 1' "$summary"
          grep -Fq 'example.GroupedTest.smokeRuns' "$summary"
          if grep -Fq 'example.GroupedTest.slowMustStayFilteredOut' "$summary"; then
            echo 'ScenarioMesh executed a TestNG method excluded by -Dgroups=smoke'
            exit 1
          fi
