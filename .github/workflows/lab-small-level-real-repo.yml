name: lab-small-level-real-repo

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  real-repository:
    name: Real repo - ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cucumber-official
            url: https://github.com/cucumber/cucumber-jvm-starter-maven-java.git
            ref: 3d900db164a29f4ccb5e4aa6eaddf62d3312b3bc
            project_dir: .
            expected_mode: takeover
            maven_args: ''
          - target: junit-official-maven
            url: https://github.com/junit-team/junit-examples.git
            ref: bb7eb03dc51dc8ea9ddebe8022e4362d0d427174
            project_dir: junit-jupiter-starter-maven
            expected_mode: takeover
            maven_args: ''
          - target: spring-petclinic
            url: https://github.com/spring-projects/spring-petclinic.git
            ref: 818c4136ea971c21674525f9053de0d9c7ad8cfe
            project_dir: .
            expected_mode: takeover
            maven_args: ''
          - target: apache-commons-lang
            url: https://github.com/apache/commons-lang.git
            ref: 29624cdb50ecd794207d561345b2fc9ca3a9d326
            project_dir: .
            expected_mode: pass-through
            maven_args: '-Drat.skip=true'
          - target: apache-commons-io
            url: https://github.com/apache/commons-io.git
            ref: 2c6bf8dea065e96651661d5e277e35b2f343d879
            project_dir: .
            expected_mode: takeover
            maven_args: '-Drat.skip=true'
          - target: apache-commons-text
            url: https://github.com/apache/commons-text.git
            ref: 2b02f079f088a41e5bda78274872b3af3863a560
            project_dir: .
            expected_mode: takeover
            maven_args: '-Drat.skip=true'
          - target: junit4-official
            url: https://github.com/junit-team/junit4.git
            ref: 890f3c972647de378f25e7271d8fbbd9d3456b79
            project_dir: .
            expected_mode: pass-through
            maven_args: ''

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Environment
        run: |
          java -version
          mvn -version
          git --version
          python3 --version

      - name: Run native-vs-ScenarioMesh real-repository lab
        env:
          TARGET_NAME: ${{ matrix.target }}
          TARGET_URL: ${{ matrix.url }}
          TARGET_REF: ${{ matrix.ref }}
          TARGET_PROJECT_DIR: ${{ matrix.project_dir }}
          TARGET_EXPECTED_MODE: ${{ matrix.expected_mode }}
          TARGET_MAVEN_ARGS: ${{ matrix.maven_args }}
          SCENARIOMESH_ROOT: ${{ github.workspace }}
          SCENARIOMESH_WORKERS: '4'
          LAB_OUT: ${{ runner.temp }}/scenariomesh-real-lab/${{ matrix.target }}
        run: python3 tools/scenariomesh-test-lab/small_level_runner.py

      - name: Preserve lab logs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scenariomesh-real-lab-${{ matrix.target }}
          path: ${{ runner.temp }}/scenariomesh-real-lab/${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 14
