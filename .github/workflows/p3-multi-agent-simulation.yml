name: p3-multi-agent-simulation
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  twelve-lane-simulation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and install ScenarioMesh
        run: mvn -B clean install -DskipTests
      - name: Compile distributed target
        working-directory: examples/testng-example
        run: mvn -B clean test-compile
      - name: Simulate Jenkins agents with 2 + 6 + 4 allocated lanes
        working-directory: examples/testng-example
        run: |
          set -euo pipefail
          token="multi-agent-${{ github.run_id }}-${{ matrix.java }}"
          port=$((45000 + ${{ matrix.java }}))
          rm -rf target/scenariomesh
          set +e
          mvn -B io.scenariomesh:scenariomesh-maven-plugin:0.1.0-SNAPSHOT:run \
            -Dscenariomesh.workers.mode=remote \
            -Dscenariomesh.workers.count=12 \
            -Dscenariomesh.workers.minimumReady=12 \
            -Dscenariomesh.distributed.bindHost=127.0.0.1 \
            -Dscenariomesh.distributed.bindPort="$port" \
            -Dscenariomesh.distributed.token="$token" \
            -Dscenariomesh.distributed.registrationTimeout=PT60S \
            > multi-coordinator.log 2>&1 &
          coordinator=$!
          set -e
          for i in $(seq 1 90); do
            if grep -Fq 'waiting for 12 authenticated worker process(es)' multi-coordinator.log 2>/dev/null; then break; fi
            if ! kill -0 "$coordinator" 2>/dev/null; then cat multi-coordinator.log; exit 1; fi
            sleep 1
          done
          grep -Fq 'waiting for 12 authenticated worker process(es)' multi-coordinator.log

          pids=''
          start_worker() {
            agent="$1"; lane="$2"; id="${agent}-${lane}"
            JENKINS_NODE_NAME="$agent" EXECUTOR_NUMBER="$lane" \
            mvn -B io.scenariomesh:scenariomesh-maven-plugin:0.1.0-SNAPSHOT:worker \
              -Dscenariomesh.worker.host=127.0.0.1 \
              -Dscenariomesh.worker.port="$port" \
              -Dscenariomesh.distributed.token="$token" \
              -Dscenariomesh.worker.id="$id" > "$id.log" 2>&1 &
            pids="$pids $!"
          }
          for lane in 0 1; do start_worker agent-a "$lane"; done
          for lane in 0 1 2 3 4 5; do start_worker agent-b "$lane"; done
          for lane in 0 1 2 3; do start_worker agent-c "$lane"; done

          wait "$coordinator"
          for pid in $pids; do wait "$pid"; done
          cat multi-coordinator.log
          grep -Fq '12 remote worker(s) ready' multi-coordinator.log
          test "$(grep -c 'WORKER_REGISTERED' target/scenariomesh/runs/*/events.jsonl)" -eq 12
          test -f target/scenariomesh/summary.json
          grep -Fq '"passed" : 6' target/scenariomesh/summary.json
          grep -Fq '"skipped" : 2' target/scenariomesh/summary.json
          for id in agent-a-0 agent-a-1 agent-b-0 agent-b-1 agent-b-2 agent-b-3 agent-b-4 agent-b-5 agent-c-0 agent-c-1 agent-c-2 agent-c-3; do
            grep -Fq "$id REMOTE READY" multi-coordinator.log
          done
          if grep -Fq "$token" multi-coordinator.log; then
            echo 'distributed token leaked into logs'
            exit 1
          fi
