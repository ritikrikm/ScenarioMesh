name: p7-cli-product
on: [push, pull_request]

jobs:
  cli-product:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and install ScenarioMesh
        run: mvn -B clean install
      - name: CLI version
        run: |
          cli="scenariomesh-cli/target/scenariomesh-cli-0.1.0-SNAPSHOT.jar"
          java -jar "$cli" version | grep -Fxq '0.1.0-SNAPSHOT'
      - name: Doctor and deep compatibility are non-destructive
        run: |
          cli="$PWD/scenariomesh-cli/target/scenariomesh-cli-0.1.0-SNAPSHOT.jar"
          java -jar "$cli" doctor --root examples/junit5-example
          java -jar "$cli" compatibility --root examples/junit5-example > compatibility.log
          grep -Fq 'Acceleration' compatibility.log
          grep -Fq 'ScenarioMesh can safely own this test execution' compatibility.log
          java -jar "$cli" explain --root examples/junit5-example > explain.log
          grep -Fq 'ScenarioMesh preflight: ownership proven' explain.log
      - name: Init remains idempotent and dry-run safe
        run: |
          cli="$PWD/scenariomesh-cli/target/scenariomesh-cli-0.1.0-SNAPSHOT.jar"
          project="$RUNNER_TEMP/scenariomesh-p7-init"
          mkdir -p "$project"
          printf '%s\n' '<project><modelVersion>4.0.0</modelVersion><groupId>example</groupId><artifactId>fixture</artifactId><version>1</version></project>' > "$project/pom.xml"
          java -jar "$cli" init --project "$project"
          before="$(sha256sum "$project/.mvn/extensions.xml" "$project/scenariomesh.yml")"
          java -jar "$cli" init --project "$project" | grep -Fq 'already initialized; no changes required'
          test "$before" = "$(sha256sum "$project/.mvn/extensions.xml" "$project/scenariomesh.yml")"
