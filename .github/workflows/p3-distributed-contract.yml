name: p3-distributed-contract
on: [push, pull_request]

jobs:
  distributed-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Distributed correctness contracts
        run: mvn -B -pl scenariomesh-coordinator -am test -Dtest='*LeaseRegistryTest,*RemoteWorkerDirectoryTest,*DistributedWorkAuthorityTest,*WorkerRegistrationValidatorTest,*LeasedResponseReaderTest,*LeaseHeartbeatEmitterTest,*WorkerCapabilitiesTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Build and install ScenarioMesh
        run: mvn -B clean install -DskipTests
      - name: Transparent remote takeover fails closed to native Maven
        working-directory: examples/testng-example
        run: |
          token="p3-pass-through-${{ github.run_id }}-${{ matrix.java }}"
          port=$((41000 + ${{ matrix.java }}))
          rm -rf target/scenariomesh target/surefire-reports
          mvn -B clean test \
            -Dscenariomesh.workers.mode=remote \
            -Dscenariomesh.workers.count=2 \
            -Dscenariomesh.workers.minimumReady=2 \
            -Dscenariomesh.distributed.bindHost=127.0.0.1 \
            -Dscenariomesh.distributed.bindPort="$port" \
            -Dscenariomesh.distributed.token="$token" \
            > pass-through.log 2>&1
          cat pass-through.log
          grep -Fq 'ScenarioMesh preflight: native Maven pass-through - remote distributed execution is configured' pass-through.log
          if grep -Fq 'Remote worker coordinator listening on' pass-through.log; then
            echo 'Transparent remote takeover started a coordinator before remote ownership was proven'
            exit 1
          fi
          test -d target/surefire-reports
          if test -f target/scenariomesh/summary.json; then
            echo 'ScenarioMesh unexpectedly produced a remote run summary during native pass-through'
            exit 1
          fi
      - name: Compile target for explicit remote run
        working-directory: examples/testng-example
        run: mvn -B clean test-compile
      - name: Two remote workers execute an explicit real target run
        working-directory: examples/testng-example
        run: |
          token="p3-${{ github.run_id }}-${{ matrix.java }}"
          port=$((42000 + ${{ matrix.java }}))
          rm -rf target/scenariomesh
          set +e
          mvn -B io.scenariomesh:scenariomesh-maven-plugin:0.1.0-SNAPSHOT:run \
            -Dscenariomesh.workers.mode=remote \
            -Dscenariomesh.workers.count=2 \
            -Dscenariomesh.workers.minimumReady=2 \
            -Dscenariomesh.distributed.bindHost=127.0.0.1 \
            -Dscenariomesh.distributed.bindPort="$port" \
            -Dscenariomesh.distributed.token="$token" \
            -Dscenariomesh.distributed.registrationTimeout=PT45S \
            > coordinator.log 2>&1 &
          coordinator_pid=$!
          set -e
          for i in $(seq 1 90); do
            if grep -Fq 'Remote worker coordinator listening on' coordinator.log 2>/dev/null; then break; fi
            if ! kill -0 "$coordinator_pid" 2>/dev/null; then cat coordinator.log; exit 1; fi
            sleep 1
          done
          grep -Fq 'Remote worker coordinator listening on' coordinator.log
          mvn -B io.scenariomesh:scenariomesh-maven-plugin:0.1.0-SNAPSHOT:worker \
            -Dscenariomesh.worker.host=127.0.0.1 -Dscenariomesh.worker.port="$port" \
            -Dscenariomesh.distributed.token="$token" -Dscenariomesh.worker.id=remote-a \
            > worker-a.log 2>&1 &
          worker_a=$!
          mvn -B io.scenariomesh:scenariomesh-maven-plugin:0.1.0-SNAPSHOT:worker \
            -Dscenariomesh.worker.host=127.0.0.1 -Dscenariomesh.worker.port="$port" \
            -Dscenariomesh.distributed.token="$token" -Dscenariomesh.worker.id=remote-b \
            > worker-b.log 2>&1 &
          worker_b=$!
          wait "$coordinator_pid"
          wait "$worker_a"
          wait "$worker_b"
          cat coordinator.log
          cat worker-a.log
          cat worker-b.log
          test -f target/scenariomesh/summary.json
          grep -Fq '"passed" : 6' target/scenariomesh/summary.json
          grep -Fq '"skipped" : 2' target/scenariomesh/summary.json
          grep -Fq 'remote-a REMOTE READY' coordinator.log
          grep -Fq 'remote-b REMOTE READY' coordinator.log
          if grep -Fq "$token" coordinator.log; then
            echo 'Remote authentication token leaked into coordinator logs'
            exit 1
          fi
