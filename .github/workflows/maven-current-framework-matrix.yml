name: Maven current-framework matrix
on: [push, pull_request]

jobs:
  junit-surefire:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        surefire: ['3.5.2', '3.6.0-M1']
        junit: ['5.10.5', '5.14.4', '6.1.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Install ScenarioMesh
        run: mvn -B clean install -DskipTests
      - name: Prove native and ScenarioMesh JUnit equivalence
        run: |
          bash scripts/compat/maven-equivalence.sh examples/maven-equivalence-example \
            -Djunit.version=${{ matrix.junit }} \
            -Dsurefire.version=${{ matrix.surefire }} \
            '-Dtest=AlphaContractTest#alphaOne+alphaTwo' -Dcontract.value=current-matrix

  failsafe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        failsafe: ['3.5.2', '3.6.0-M1']
        junit: ['5.10.5', '5.14.4', '6.1.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install ScenarioMesh
        run: mvn -B clean install -DskipTests
      - name: Prove native and ScenarioMesh Failsafe equivalence
        env:
          MAVEN_EQUIVALENCE_GOAL: verify
        run: |
          bash scripts/compat/maven-equivalence.sh examples/failsafe-junit5-example \
            -Djunit.version=${{ matrix.junit }} \
            -Dfailsafe.version=${{ matrix.failsafe }} \
            '-Dit.test=CheckoutIT#cardPayment+bankTransfer'

  cucumber-and-testng:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [cucumber, testng]
        surefire: ['3.5.2', '3.6.0-M1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install ScenarioMesh
        run: mvn -B clean install -DskipTests
      - name: Prove current Cucumber equivalence
        if: matrix.framework == 'cucumber'
        working-directory: examples/cucumber-junit-platform-example
        run: |
          mvn -B clean test -Dcucumber.version=7.34.7 -Dsurefire.version=${{ matrix.surefire }}
          test -f target/scenariomesh/summary.json
          grep -Fq '"passed" : 6' target/scenariomesh/summary.json
      - name: Prove TestNG suite equivalence
        if: matrix.framework == 'testng'
        run: |
          bash scripts/compat/maven-equivalence.sh examples/testng-suite-xml-example \
            -Dsurefire.version=${{ matrix.surefire }}
